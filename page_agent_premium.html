<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 网页操作员 - 演示</title>
    <!-- 1. 引入 Tailwind CSS 让页面好看点 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', system-ui, -apple-system, sans-serif;
        }

        body { color-scheme: dark; }

        /* 给 AI 操作的高亮留点样式 */
        .agent-highlight {
            outline: 2px solid #a78bfa !important;
            outline-offset: 2px;
            box-shadow: 0 0 0 6px rgba(167, 139, 250, 0.15), 0 0 24px rgba(167, 139, 250, 0.4) !important;
            transition: all 0.3s ease;
        }

        /* 玻璃拟态卡片 */
        .glass {
            background: rgba(255, 255, 255, 0.045);
            backdrop-filter: blur(28px) saturate(140%);
            -webkit-backdrop-filter: blur(28px) saturate(140%);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* 表单输入框 */
        .field {
            width: 100%;
            background: rgba(255, 255, 255, 0.035);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 0.85rem;
            padding: 0.7rem 0.95rem;
            color: #fff;
            font-size: 0.875rem;
            transition: all 0.2s ease;
            color-scheme: dark;
        }
        .field::placeholder { color: rgba(255, 255, 255, 0.3); }
        .field:hover { border-color: rgba(255, 255, 255, 0.18); }
        .field:focus {
            outline: none;
            border-color: rgba(167, 139, 250, 0.6);
            background: rgba(255, 255, 255, 0.06);
            box-shadow: 0 0 0 4px rgba(167, 139, 250, 0.14);
        }
        /* 日期 / 下拉原生控件暗色适配 */
        .field::-webkit-calendar-picker-indicator { filter: invert(0.8); cursor: pointer; }

        /* 提交成功态 */
        .btn-success {
            background-image: linear-gradient(to right, #10b981, #059669) !important;
            box-shadow: 0 10px 30px -8px rgba(16, 185, 129, 0.45) !important;
        }

        /* 背景光晕缓动 */
        @keyframes float-slow {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(40px, -30px) scale(1.12); }
        }
        .animate-float-slow { animation: float-slow 16s ease-in-out infinite; }
        @keyframes float-slow-2 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(-30px, 40px) scale(1.08); }
        }
        .animate-float-slow-2 { animation: float-slow-2 18s ease-in-out infinite; }

        /* 卡片入场 */
        @keyframes fade-up {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-up { animation: fade-up 0.8s cubic-bezier(0.16, 1, 0.3, 1) both; }

        @media (prefers-reduced-motion: reduce) {
            .animate-float-slow, .animate-float-slow-2, .animate-fade-up { animation: none; }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 sm:p-6 relative overflow-hidden">

    <!-- 背景层：深色底 + 流动光晕 -->
    <div class="fixed inset-0 -z-20 bg-[#070710]"></div>
    <div class="fixed inset-0 -z-10 overflow-hidden">
        <div class="absolute top-[-12%] left-[-8%] w-[560px] h-[560px] rounded-full bg-violet-600/25 blur-[130px] animate-float-slow"></div>
        <div class="absolute top-1/3 right-[-10%] w-[520px] h-[520px] rounded-full bg-indigo-600/20 blur-[130px] animate-float-slow-2"></div>
        <div class="absolute bottom-[-15%] left-1/3 w-[480px] h-[480px] rounded-full bg-fuchsia-600/12 blur-[130px] animate-float-slow"></div>
    </div>

    <!-- 主卡片 -->
    <div class="relative w-full max-w-2xl animate-fade-up">
        <!-- 卡片环境光晕 -->
        <div class="absolute -inset-1 bg-gradient-to-br from-violet-600/20 via-indigo-600/10 to-fuchsia-600/20 rounded-[2rem] blur-2xl"></div>

        <div class="relative glass rounded-[1.75rem] shadow-2xl shadow-black/50 overflow-hidden">
            <!-- 顶部高光线 -->
            <div class="h-px bg-gradient-to-r from-transparent via-white/30 to-transparent"></div>

            <!-- 头部 -->
            <div class="px-7 pt-7 pb-6">
                <div class="flex items-start justify-between gap-4">
                    <div class="flex items-center gap-3.5">
                        <div class="relative">
                            <div class="absolute inset-0 rounded-2xl bg-gradient-to-br from-violet-500 to-indigo-600 blur-md opacity-60"></div>
                            <div class="relative w-11 h-11 rounded-2xl bg-gradient-to-br from-violet-500 to-indigo-600 flex items-center justify-center shadow-lg shadow-violet-600/30">
                                <svg class="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.904 9 18.75l-.813-2.846a4.5 4.5 0 0 0-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 0 0 3.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 0 0 3.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 0 0-3.09 3.09ZM18.259 8.715 18 9.75l-.259-1.035a3.375 3.375 0 0 0-2.455-2.456L14.25 6l1.036-.259a3.375 3.375 0 0 0 2.455-2.456L18 2.25l.259 1.035a3.375 3.375 0 0 0 2.456 2.456L21.75 6l-1.035.259a3.375 3.375 0 0 0-2.456 2.456Z" />
                                </svg>
                            </div>
                        </div>
                        <div>
                            <h1 class="text-lg font-semibold tracking-tight text-white">AI 网页操作员</h1>
                            <p class="text-xs text-white/50 mt-0.5">输入自然语言指令，AI 将自动操作页面</p>
                        </div>
                    </div>
                    <span class="shrink-0 text-[10px] font-semibold uppercase tracking-[0.15em] text-white/45 border border-white/10 rounded-full px-2.5 py-1 bg-white/5">Demo</span>
                </div>
            </div>

            <!-- 表单区域 -->
            <div class="px-7 pb-7 space-y-5">
                <!-- 区块标题 -->
                <div class="flex items-center gap-3">
                    <span class="text-[11px] font-semibold uppercase tracking-[0.18em] text-white/40">员工信息</span>
                    <div class="flex-1 h-px bg-gradient-to-r from-white/12 to-transparent"></div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-white/60 mb-1.5" for="userName">姓名</label>
                        <input type="text" id="userName" class="field" placeholder="请输入姓名">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-white/60 mb-1.5" for="userDept">部门</label>
                        <select id="userDept" class="field">
                            <option value="">请选择...</option>
                            <option value="tech">技术研发部</option>
                            <option value="product">产品设计部</option>
                            <option value="ops">运营推广部</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-medium text-white/60 mb-1.5" for="joinDate">入职日期</label>
                    <input type="date" id="joinDate" class="field">
                </div>

                <div class="flex flex-wrap items-center gap-x-5 gap-y-2 pt-0.5">
                    <label class="flex items-center gap-2 cursor-pointer select-none group">
                        <input type="checkbox" id="agreeTerms" class="h-4 w-4 rounded border-white/20 bg-white/5 text-violet-500 focus:ring-violet-500/40 focus:ring-offset-0 accent-violet-500">
                        <span class="text-sm text-white/70 group-hover:text-white/90 transition-colors">我已阅读并同意《员工手册》</span>
                    </label>
                    <label class="flex items-center gap-2 cursor-pointer select-none group">
                        <input type="checkbox" id="subscribeNews" class="h-4 w-4 rounded border-white/20 bg-white/5 text-violet-500 focus:ring-violet-500/40 focus:ring-offset-0 accent-violet-500">
                        <span class="text-sm text-white/70 group-hover:text-white/90 transition-colors">订阅周报</span>
                    </label>
                </div>

                <button id="submitBtn" class="w-full py-3 px-4 rounded-xl font-medium text-sm transition-all duration-300 bg-gradient-to-r from-violet-600 to-indigo-600 text-white shadow-lg shadow-violet-600/25 hover:shadow-violet-600/45 hover:-translate-y-0.5 active:translate-y-0 disabled:from-white/10 disabled:to-white/10 disabled:text-white/40 disabled:shadow-none disabled:translate-y-0 disabled:cursor-not-allowed" disabled>
                    提交申请
                </button>
            </div>

            <!-- AI 交互区 -->
            <div class="border-t border-white/10 bg-white/[0.02] px-7 py-5">
                <div class="flex items-center gap-2 mb-3">
                    <span class="relative flex h-2 w-2">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-400"></span>
                    </span>
                    <span class="text-[11px] font-semibold uppercase tracking-[0.18em] text-white/50">AI 助手</span>
                </div>
                <div class="flex gap-2">
                    <div class="relative flex-1">
                        <svg class="w-4 h-4 text-white/30 absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.904 9 18.75l-.813-2.846a4.5 4.5 0 0 0-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 0 0 3.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 0 0 3.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 0 0-3.09 3.09Z" />
                        </svg>
                        <input type="text" id="aiCommand" class="field pl-9" placeholder="试试说：帮我把姓名填成张三，部门选技术研发，日期改成下周五，然后勾选同意...">
                    </div>
                    <button id="sendBtn" class="flex items-center gap-1.5 shrink-0 bg-gradient-to-r from-violet-600 to-indigo-600 hover:from-violet-500 hover:to-indigo-500 text-white px-4 py-2 rounded-xl text-sm font-medium transition-all shadow-lg shadow-violet-600/25 hover:shadow-violet-600/45 hover:-translate-y-0.5 active:translate-y-0">
                        <span>发送</span>
                        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M6 12 3.269 3.125A59.769 59.769 0 0 1 21.485 12 59.768 59.768 0 0 1 3.27 20.875L5.999 12Zm0 0h7.5" />
                        </svg>
                    </button>
                </div>
                <div id="aiStatus" class="mt-2.5 text-xs text-white/40 h-4"></div>
            </div>
        </div>
    </div>

    <!-- 2. 核心：引入 Page Agent (Demo 版本，自带免费模型，无需 Key) -->
    <script src="https://cdn.jsdelivr.net/npm/page-agent@latest/dist/iife/page-agent.demo.js"></script>

    <!-- 3. 简单的交互逻辑 -->
    <script>
        // 监听表单变化，自动启用提交按钮
        const inputs = document.querySelectorAll('input, select');
        const submitBtn = document.getElementById('submitBtn');

        inputs.forEach(input => {
            input.addEventListener('change', checkForm);
            input.addEventListener('input', checkForm);
        });

        function checkForm() {
            const name = document.getElementById('userName').value.trim();
            const dept = document.getElementById('userDept').value;
            const date = document.getElementById('joinDate').value;
            const agree = document.getElementById('agreeTerms').checked;

            submitBtn.disabled = !(name && dept && date && agree);
        }

        // 提交按钮点击效果
        submitBtn.addEventListener('click', () => {
            if (!submitBtn.disabled) {
                const originalText = submitBtn.innerText;
                submitBtn.innerText = '✓ 提交成功';
                submitBtn.classList.add('btn-success');
                setTimeout(() => {
                    submitBtn.innerText = originalText;
                    submitBtn.classList.remove('btn-success');
                    checkForm(); // 重置状态
                }, 2000);
            }
        });

        // 简单的回车发送
        document.getElementById('aiCommand').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') document.getElementById('sendBtn').click();
        });
    </script>
</body>
</html>
